<text x="627.0" y="138" font-size="15" font-weight="700" fill="#686860">04</text>
<text x="627.0" y="170" font-size="19" font-weight="700" fill="#111111">算引用友好度</text>
<text x="627.0" y="198" font-size="15" font-weight="400" fill="#33332e">0 到 100 分，</text>
<text x="627.0" y="220" font-size="15" font-weight="400" fill="#33332e">提示项不计分</text>
<path d="M782.3 179.0 L796.3 179.0" stroke="#111111" stroke-width="2.5"/>
