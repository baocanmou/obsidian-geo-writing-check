<text x="1007.7" y="138" font-size="15" font-weight="700" fill="#686860">06</text>
<text x="1007.7" y="170" font-size="19" font-weight="700" fill="#111111">修改后复查</text>
<text x="1007.7" y="198" font-size="15" font-weight="400" fill="#33332e">或复制检查报告</text>
<text x="1007.7" y="220" font-size="15" font-weight="400" fill="#33332e">给作者</text>
<text x="40" y="294" font-size="16" fill="#686860">分数只反映写法是否便于 AI 理解和引用，不代表会被收录、引用或推荐。</text>
