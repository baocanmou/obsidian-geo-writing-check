<text x="817.3" y="170" font-size="19" font-weight="700" fill="#111111">逐项给出位置</text>
<text x="817.3" y="198" font-size="15" font-weight="400" fill="#33332e">编辑器虚线标注，</text>
<text x="817.3" y="220" font-size="15" font-weight="400" fill="#33332e">悬停看改法</text>
<path d="M972.7 179.0 L986.7 179.0" stroke="#111111" stroke-width="2.5"/>
