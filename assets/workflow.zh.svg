<rect x="230.3" y="104" width="168.3" height="150" rx="14" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="246.3" y="138" font-size="15" font-weight="700" fill="#686860">02</text>
<text x="246.3" y="170" font-size="19" font-weight="700" fill="#111111">读取笔记属性</text>
<text x="246.3" y="198" font-size="15" font-weight="400" fill="#33332e">标题、关键词、</text>
<text x="246.3" y="220" font-size="15" font-weight="400" fill="#33332e">主体名称、日期</text>
