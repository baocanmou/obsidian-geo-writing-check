<text x="40" y="62" font-size="26" font-weight="700" fill="#111111">GEO 写作检查的工作流程</text>
<rect x="40.0" y="104" width="168.3" height="150" rx="14" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="56.0" y="138" font-size="15" font-weight="700" fill="#686860">01</text>
<text x="56.0" y="170" font-size="19" font-weight="700" fill="#111111">打开一篇文章</text>
<text x="56.0" y="198" font-size="15" font-weight="400" fill="#33332e">正文 300 字以上</text>
<text x="56.0" y="220" font-size="15" font-weight="400" fill="#33332e">才检查</text>
