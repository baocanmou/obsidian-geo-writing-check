<text x="436.7" y="138" font-size="15" font-weight="700" fill="#686860">03</text>
<text x="436.7" y="170" font-size="19" font-weight="700" fill="#111111">17 项规则检查</text>
<text x="436.7" y="198" font-size="15" font-weight="400" fill="#33332e">直接回答、主体、</text>
<text x="436.7" y="220" font-size="15" font-weight="400" fill="#33332e">证据、摘录、时效</text>
<path d="M592.0 179.0 L606.0 179.0" stroke="#111111" stroke-width="2.5"/>
